services:
  preprocessing:
    build:
      context: install/preprocessing
    command: /bin/bash
    restart: unless-stopped
    volumes:
      - ./code/preprocessing:/code
      - ./code/common:/code/common
      - ./data/preprocessing:/data:ro
      - ./results/preprocessing:/results
    working_dir: /code
    environment:
      - TZ=${TZ:-UTC}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:--1}
      - CUDA_LAUNCH_BLOCKING=${CUDA_LAUNCH_BLOCKING:-1}
      - DATA_DIR=/data
      - RESULTS_DIR=/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 'all'
              capabilities: [gpu]
    stdin_open: true
    tty: true

  webapp:
    build:
      context: install/webapp
    command: bash startserver.sh
    restart: unless-stopped
    expose:
      - "${PORT:-8080}"
    volumes:
      - ./code/webapp:/code
      - ./code/common:/code/common
      - ./data/webapp:/data:ro
      - ./logs/webapp:/logs
      - staticnginx:/static
    environment:
      - PORT=${PORT:-8080}
      - TZ=${TZ:-UTC}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:--1}
      - CUDA_LAUNCH_BLOCKING=${CUDA_LAUNCH_BLOCKING:-1}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-0}
      - DJANGO_PROTOCOL_HOST_PORT=${DJANGO_PROTOCOL_HOST_PORT:-http:localhost:${PORT:-8080},http:127.0.0.1:${PORT:-8080},http:webapp:${PORT:-8080}}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-"your-secret-key"}
      - DATA_DIR=/data
      - LOGS_DIR=/logs
    working_dir: /code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 'all'
              capabilities: [gpu]
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - staticnginx:/var/www/static:ro
      - ./nginx/conf.d/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./logs/nginx:/var/log/nginx
    environment:
      - PORT=${PORT:-8080}
      - TZ=${TZ:-UTC}
    depends_on:
      - webapp

volumes:
  staticnginx: